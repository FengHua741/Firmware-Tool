## ======================================================================
## _CLIENT_VARIABLE 配置模板
## 来源: Mainsail/Fluidd 官方参考配置
## 用途: 暂停/取消打印时自定义停靠位置、回抽参数等
## ======================================================================
##
## 使用说明:
##   1. 需要在 printer.cfg 中添加 [include mainsail.cfg] 或 [include fluidd.cfg]
##      否则此配置无法生效
##   2. 将下方 [gcode_macro _CLIENT_VARIABLE] 添加到 printer.cfg 中
##   3. False 代表未启用
##   4. gcode: 行必须保留，不能删除
##
## ======================================================================

[gcode_macro _CLIENT_VARIABLE]
### 暂停宏相关自定义设置
variable_use_custom_pos   : False ; 是否使用x, y自定义停靠坐标 [True/False]
variable_custom_park_x    : 0.0   ; 暂停打印时X位置
variable_custom_park_y    : 0.0   ; 暂停打印时Y位置
variable_custom_park_dz   : 2.0   ; 暂停打印时Z上升的距离 (单位为毫米)

### 取消打印宏相关自定义设置
variable_park_at_cancel   : False ; 是否在执行取消打印宏时允许移动工具头到停车位置 [True/False]
variable_park_at_cancel_x : None  ; 取消打印后X位置 (None=使用custom_park位置)
variable_park_at_cancel_y : None  ; 取消打印后Y位置 (None=使用custom_park位置)

### 暂停与取消时挤出机动作
variable_retract          : 1.0     ; 暂停打印时挤出机回抽长度(mm)
variable_cancel_retract   : 5.0     ; 取消打印时挤出机回抽长度(mm)
variable_speed_retract    : 35.0    ; 挤出机回抽速度 mm/s
variable_unretract        : 1.0     ; 恢复打印时挤出长度(mm)
variable_speed_unretract  : 35.0    ; 挤出机挤出速度 mm/s
variable_speed_hop        : 15.0    ; Z轴移动速度 mm/s
variable_speed_move       : 100.0   ; 移动速度 mm/s

### 空闲超时配置
### 一天为86400秒
variable_idle_timeout     : 86400  ; 空闲超时到启动所需要的秒数. 设置为0意味着不会设置或恢复任何值

# !!!注意 如果你设置use_fw_retract: True, 那么在printer.cfg中必须定义 [firmware_retraction] !!!
variable_use_fw_retract   : False ; 是否使用固件回抽，替代手动版本 [True/False]

variable_runout_sensor    : ""    ; 如果定义了传感器，它将在检测到没有丝料的情况下，用来取消执行RESUME.
#                                  指定runout传感器的配置名称，例如 "filament_switch_sensor runout"
#                                  提醒：使用你的printer.cfg中相同的名称

# !!!自定义宏，请小心使用并查看相应宏的部分.
# 这些宏是用于像设置状态LED的简单操作。请确保你的宏不会干扰基本宏的功能.
# 只支持单行命令，请创建一个宏，如果你需要多个命令。
variable_user_pause_macro : ""    ; ""内的所有内容将在klipper base pause (PAUSE_BASE)函数之后执行
variable_user_resume_macro: ""    ; ""内的所有内容将在klipper base resume (RESUME_BASE)函数之前执行
variable_user_cancel_macro: ""    ; ""内的所有内容将在klipper base cancel (CANCEL_PRINT_BASE)函数之前执行
gcode:
